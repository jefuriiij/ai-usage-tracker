<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>tray-icon-renderer</title>
</head>
<body>
  <!--
    Hidden off-screen renderer. main.js calls window.drawBadge(...) via
    webContents.executeJavaScript and gets back a PNG data URL, which it turns
    into a nativeImage for the tray. Tray.setTitle() is macOS-only, so on Windows
    we must paint the number directly into the icon.
  -->
  <canvas id="c" width="32" height="32"></canvas>
  <script>
    /**
     * Draw a 32x32 tray badge: a dark warm-gradient rounded square (espresso
     * fade) with a large bold white number on it, and an optional accent
     * stripe along the bottom identifying which provider the number belongs to.
     * @param {string} text    e.g. "37", "100", "?", "—"
     * @param {boolean} stale  dim the badge when showing stale data
     * @param {string} [accent] CSS color for the bottom stripe (omit for none)
     * @returns {string} PNG data URL
     */
    function drawBadge(text, stale, accent) {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 32, 32);

      const r = 7;
      function roundPath() {
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.arcTo(32, 0, 32, 32, r);
        ctx.arcTo(32, 32, 0, 32, r);
        ctx.arcTo(0, 32, 0, 0, r);
        ctx.arcTo(0, 0, 32, 0, r);
        ctx.closePath();
      }

      ctx.globalAlpha = stale ? 0.5 : 1;

      // Vertical espresso gradient: near-black top (#120B05) -> warm brown
      // bottom (#784921), with the warmth kept low like the reference.
      const g = ctx.createLinearGradient(0, 0, 0, 32);
      g.addColorStop(0, '#120b05');
      g.addColorStop(0.5, '#2a190d');
      g.addColorStop(1, '#784921');
      roundPath();
      ctx.fillStyle = g;
      ctx.fill();

      // Provider accent stripe along the bottom edge, clipped to the rounded
      // corners. This is what tells you whose percentage you're looking at
      // when the badge tracks whichever provider is highest.
      if (accent) {
        ctx.save();
        roundPath();
        ctx.clip();
        ctx.fillStyle = accent;
        ctx.fillRect(0, 28, 32, 4);
        ctx.restore();
      }

      // Faint hairline so the dark icon keeps an edge on a dark taskbar.
      roundPath();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
      ctx.stroke();

      // Number — large, bold, white. Nudged up when a stripe is present so the
      // glyphs stay optically centred in the remaining space.
      ctx.globalAlpha = stale ? 0.7 : 1;
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const len = String(text).length;
      const size = len >= 3 ? 15 : len === 2 ? 21 : 23;
      ctx.font = `700 ${size}px "Segoe UI", system-ui, sans-serif`;
      ctx.fillText(String(text), 16, accent ? 15 : 17);

      return canvas.toDataURL('image/png');
    }

    /**
     * Draw a small monochrome glyph for a tray context-menu item. Rendered in
     * the given color so it can match the system menu theme (light vs dark).
     * @param {string} name  'panel' | 'refresh' | 'external' | 'power' | 'badge' |
     *                       'check-on' | 'check-off' | 'update'
     * @param {string} color CSS color (e.g. 'rgba(255,255,255,0.85)')
     * @param {number} size  output px (16 for menus; larger for previews)
     * @returns {string} PNG data URL
     */
    function drawMenuGlyph(name, color, size) {
      size = size || 16;
      const cv = document.createElement('canvas');
      cv.width = size;
      cv.height = size;
      const x = cv.getContext('2d');
      x.scale(size / 16, size / 16); // author everything in a 16x16 space
      x.strokeStyle = color;
      x.fillStyle = color;
      x.lineWidth = 1.4;
      x.lineCap = 'round';
      x.lineJoin = 'round';

      const rr = (px, py, w, h, r) => {
        x.beginPath();
        x.moveTo(px + r, py);
        x.arcTo(px + w, py, px + w, py + h, r);
        x.arcTo(px + w, py + h, px, py + h, r);
        x.arcTo(px, py + h, px, py, r);
        x.arcTo(px, py, px + w, py, r);
        x.closePath();
      };

      if (name === 'panel') {
        // Mini usage panel: rounded card with two "rows".
        rr(2.5, 3, 11, 10, 2);
        x.stroke();
        x.beginPath(); x.moveTo(4.6, 6.6); x.lineTo(11.4, 6.6); x.stroke();
        x.beginPath(); x.moveTo(4.6, 9.4); x.lineTo(9, 9.4); x.stroke();
      } else if (name === 'refresh') {
        // Circular arrow: 270° ring with a ~90° gap at the top and an open
        // chevron arrowhead at the upper-left tip pointing clockwise.
        const cx = 8, cy = 8.2, r = 4.7;
        const a0 = (315 * Math.PI) / 180;
        const a1 = a0 + (270 * Math.PI) / 180; // ends at 225°
        x.beginPath();
        x.arc(cx, cy, r, a0, a1);
        x.stroke();
        const ex = cx + r * Math.cos(a1), ey = cy + r * Math.sin(a1);
        const back = a1 + Math.PI / 2 + Math.PI; // reverse of clockwise tangent
        const spread = 0.5, len = 3;
        x.beginPath();
        x.moveTo(ex + len * Math.cos(back - spread), ey + len * Math.sin(back - spread));
        x.lineTo(ex, ey);
        x.lineTo(ex + len * Math.cos(back + spread), ey + len * Math.sin(back + spread));
        x.stroke();
      } else if (name === 'external') {
        // Box with an arrow leaving the top-right (open a link).
        x.beginPath();
        x.moveTo(9.5, 4.6);
        x.lineTo(4.6, 4.6);
        x.lineTo(4.6, 11.4);
        x.lineTo(11.4, 11.4);
        x.lineTo(11.4, 6.5);
        x.stroke();
        x.beginPath(); x.moveTo(8.4, 7.6); x.lineTo(12.6, 3.4); x.stroke();
        x.beginPath();
        x.moveTo(9.4, 3.4); x.lineTo(12.6, 3.4); x.lineTo(12.6, 6.6);
        x.stroke();
      } else if (name === 'power') {
        // Power symbol: ring open at the top + vertical stroke (quit).
        const cx = 8, cy = 9, r = 4.2;
        x.beginPath();
        x.arc(cx, cy, r, (-60) * Math.PI / 180, 240 * Math.PI / 180);
        x.stroke();
        x.beginPath(); x.moveTo(8, 3.3); x.lineTo(8, 8.2); x.stroke();
      } else if (name === 'badge') {
        // Miniature tray badge: rounded square with a filled stripe along the
        // bottom — the "which provider does the icon show" submenu.
        rr(3, 2.6, 10, 10.8, 2.2);
        x.stroke();
        x.save();
        rr(3, 2.6, 10, 10.8, 2.2);
        x.clip();
        x.fillRect(3, 10.8, 10, 2.6);
        x.restore();
      } else if (name === 'check-off' || name === 'check-on') {
        // Checkbox drawn as a glyph, for menus where a real checkbox item
        // would sit outside the icon column (Linux / KDE).
        rr(3, 3, 10, 10, 2);
        x.stroke();
        if (name === 'check-on') {
          x.beginPath(); x.moveTo(5.4, 8.2); x.lineTo(7.2, 10); x.lineTo(10.7, 6.1); x.stroke();
        }
      } else if (name === 'update') {
        // Down arrow onto a baseline: an update downloaded and waiting.
        x.beginPath(); x.moveTo(8, 2.8); x.lineTo(8, 10); x.stroke();
        x.beginPath(); x.moveTo(4.9, 7.1); x.lineTo(8, 10.2); x.lineTo(11.1, 7.1); x.stroke();
        x.beginPath(); x.moveTo(3.6, 13); x.lineTo(12.4, 13); x.stroke();
      }
      return cv.toDataURL('image/png');
    }

    window.drawBadge = drawBadge;
    window.drawMenuGlyph = drawMenuGlyph;
  </script>
</body>
</html>
